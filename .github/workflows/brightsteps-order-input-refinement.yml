name: BrightSteps order input refinement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace order UI with direct numeric inputs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/page.js')
          s = p.read_text()

          new_order = '''function OrderActivity({questions,answers,setAnswers,module}){const updateSlot=(qid,slot,value)=>{const current=Array.isArray(answers[qid])?[...answers[qid]]:['','','',''];current[slot]=value;setAnswers({...answers,[qid]:current});};return <div className="orderGrid">{questions.map((q,i)=>{const placed=Array.isArray(answers[q.id])?answers[q.id]:['','','',''];return <div className="orderCard" key={q.id}><b>{i+1}. {module==='Ascending Order'?'Small → Big':'Big → Small'}</b><div className="numberChips">{q.nums.map(n=><span className="orderNumber" key={n}>{n}</span>)}</div><div className="orderAnswerInputs">{placed.map((value,slot)=><input key={slot} type="text" inputMode="numeric" pattern="[0-9]*" aria-label={`answer ${slot+1} for question ${i+1}`} placeholder={`#${slot+1}`} value={value??''} onChange={e=>updateSlot(q.id,slot,e.target.value.replace(/[^0-9]/g,''))}/>)}</div><small className="orderHint">Enter the numbers in the correct order.</small><button type="button" className="clearOrder" onClick={()=>setAnswers({...answers,[q.id]:['','','','']})}>Clear</button></div>})}</div>}'''

          pattern = r'function OrderActivity\(\{questions,answers,setAnswers,module\}\)\{.*?\}\nfunction ShapeActivity'
          s, count = re.subn(pattern, new_order + '\nfunction ShapeActivity', s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'OrderActivity not found: {count}')

          old_hint = "isOrder?'Tap a number, then tap an empty box to build the answer.'"
          s = s.replace(old_hint, "isOrder?'Type the numbers in the correct order.'")

          p.write_text(s)

          css = Path('app/globals.css')
          c = css.read_text()
          rules = '''\n\n/* Direct numeric entry for number-order questions. */\n.orderAnswerInputs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px;}\n.orderAnswerInputs input{width:100%;min-width:0;height:64px;border:3px solid #d7d0ea;border-radius:18px;background:#fff;color:#263653;text-align:center;font-size:24px;font-weight:800;outline:none;box-sizing:border-box;}\n.orderAnswerInputs input:focus{border-color:#8b7cf6;box-shadow:0 0 0 4px rgba(139,124,246,.14);}\n.orderAnswerInputs input::placeholder{color:#aaa6b5;font-size:18px;font-weight:800;}\n.orderHint{display:block;margin-top:12px;color:#8a8798;font-weight:700;}\n@media (max-width:600px){.orderAnswerInputs{gap:8px;}.orderAnswerInputs input{height:58px;border-radius:16px;font-size:22px;}.orderHint{font-size:13px;}}\n'''
          if '.orderAnswerInputs input{' not in c:
              css.write_text(c + rules)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js app/globals.css
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: use direct number inputs for ordering"
          git push
