name: BrightSteps order input UX fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace tap-to-place ordering UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/page.js')
          s = p.read_text()
          replacement = '''function OrderActivity({questions,answers,setAnswers,module}){const updateSlot=(qid,slot,value)=>{const current=Array.isArray(answers[qid])?[...answers[qid]]:['','','',''];current[slot]=value;setAnswers({...answers,[qid]:current});};return <div className="orderGrid">{questions.map((q,i)=>{const placed=Array.isArray(answers[q.id])?answers[q.id]:['','','',''];return <div className="orderCard" key={q.id}><b>{i+1}. {module==='Ascending Order'?'Small → Big':'Big → Small'}</b><div className="numberChips">{q.nums.map(n=><span className="orderNumber" key={n}>{n}</span>)}</div><div className="orderAnswerInputs">{placed.map((value,slot)=><label className="orderAnswerField" key={slot}><span>{slot+1}</span><input type="text" inputMode="numeric" pattern="[0-9]*" aria-label={`answer ${slot+1} for question ${i+1}`} placeholder="Enter" value={value??''} onChange={e=>updateSlot(q.id,slot,e.target.value.replace(/[^0-9]/g,''))}/></label>)}</div><small className="orderHint">Type the numbers in the correct order.</small><button type="button" className="clearOrder" onClick={()=>setAnswers({...answers,[q.id]:['','','','']})}>Clear</button></div>})}</div>}'''
          pattern = r'function OrderActivity\(\{questions,answers,setAnswers,module\}\)\{.*?\}\nfunction ShapeActivity'
          s2, count = re.subn(pattern, replacement + '\nfunction ShapeActivity', s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'OrderActivity replacement failed: matched {count}')
          p.write_text(s2)

          css = Path('app/globals.css')
          c = css.read_text()
          rules = '''\n\n/* Number-order answer inputs: children type the ordered values directly. */\n.orderNumber{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:56px;padding:0 16px;border-radius:18px;background:#f6f6f4;border:2px solid #e7e5e1;font-weight:800;font-size:24px;color:#263653;}\n.orderAnswerInputs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px;}\n.orderAnswerField{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;color:#8a8798;font-size:13px;}\n.orderAnswerField input{width:100%;min-width:0;height:64px;border:3px solid #d7d0ea;border-radius:18px;background:#fff;color:#263653;text-align:center;font-size:24px;font-weight:800;outline:none;box-sizing:border-box;}\n.orderAnswerField input:focus{border-color:#8b7cf6;box-shadow:0 0 0 4px rgba(139,124,246,.14);}\n.orderAnswerField input::placeholder{color:#aaa6b5;font-size:15px;font-weight:700;}\n@media (max-width:600px){.orderAnswerInputs{gap:8px;}.orderNumber{min-width:52px;height:50px;padding:0 12px;font-size:21px;border-radius:16px;}.orderAnswerField input{height:58px;border-radius:16px;font-size:22px;}.orderAnswerField{font-size:12px;}}\n'''
          if '.orderAnswerInputs{' not in c:
              css.write_text(c + rules)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js app/globals.css
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: replace order tap-to-place with answer inputs"
          git push
