name: BrightSteps UX Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply kid-friendly learning UX
        shell: python
        run: |
          from pathlib import Path
          import re

          page = Path('app/page.js')
          css = Path('app/globals.css')
          s = page.read_text(encoding='utf-8')

          # Ordering puzzles: keep answer as an array so validation matches the visible boxes.
          old_order = "if(module==='Ascending Order'||module==='Descending Order') return Array.from({length:10},(_,i)=>{const nums=shuffle(Array.from({length:4},()=>1+Math.floor(Math.random()*50)));const sorted=[...nums].sort((a,b)=>a-b);return {id:i,nums,answer:(module==='Ascending Order'?sorted:sorted.reverse()).join(',')}});"
          new_order = "if(module==='Ascending Order'||module==='Descending Order') return Array.from({length:10},(_,i)=>{let nums=shuffle(Array.from({length:4},()=>1+Math.floor(Math.random()*50)));while(new Set(nums).size<4) nums=shuffle(Array.from({length:4},()=>1+Math.floor(Math.random()*50)));const sorted=[...nums].sort((a,b)=>a-b);return {id:i,nums,answer:module==='Ascending Order'?sorted:sorted.reverse()}});"
          if old_order in s:
              s=s.replace(old_order,new_order)

          # Score ordering answers against the four explicit answer boxes.
          s=s.replace(
            "if(isMath||isSequence||isOrder||isShape||isSymbols) n=questions.reduce((x,q)=>x+(String(answers[q.id]??'').trim()===String(q.answer)?1:0),0);",
            "if(isMath||isSequence||isShape||isSymbols) n=questions.reduce((x,q)=>x+(String(answers[q.id]??'').trim()===String(q.answer)?1:0),0);else if(isOrder) n=questions.reduce((x,q)=>x+(Array.isArray(answers[q.id])&&answers[q.id].every((v,i)=>String(v??'')===String(q.answer[i]))&&answers[q.id].length===q.answer.length?1:0),0);"
          )
          s=s.replace("isOrder?'Drag each number into the boxes in the correct order.'","isOrder?'Tap a number, then tap an empty box to build the answer.'")

          # Stable MCQ routing: pass module so each visual activity can use its appropriate image.
          s=s.replace("isMCQ?<MCQActivity data={data} answers={answers} setAnswers={setAnswers}/>","isMCQ?<MCQActivity module={module} data={data} answers={answers} setAnswers={setAnswers}/>")

          freedom = """const freedomFighters=[\n['https://commons.wikimedia.org/wiki/Special:Redirect/file/MKGandhi.jpg','Who is known as the Father of the Nation?',['Mahatma Gandhi','Subhas Chandra Bose','Bhagat Singh'],'Mahatma Gandhi'],\n['https://commons.wikimedia.org/wiki/Special:Redirect/file/Subhas-chandra-bose_0.jpg','Who gave the slogan “Jai Hind”?',['Subhas Chandra Bose','Jawaharlal Nehru','Sardar Patel'],'Subhas Chandra Bose'],\n['https://commons.wikimedia.org/wiki/Special:Redirect/file/Portrait%20photograph%20of%20Bhagat%20Singh%2C%201929.jpg','Who was known for the slogan “Inquilab Zindabad”?',['Bhagat Singh','Mahatma Gandhi','Bal Gangadhar Tilak'],'Bhagat Singh'],\n['https://commons.wikimedia.org/wiki/Special:Redirect/file/MKGandhi.jpg','Who led the Dandi March?',['Mahatma Gandhi','Rani Lakshmibai','Sardar Patel'],'Mahatma Gandhi'],\n['https://commons.wikimedia.org/wiki/Special:Redirect/file/Rani%20Lakshmibai%20contemporary%20portrait.jpg','Who was the queen of Jhansi?',['Rani Lakshmibai','Sarojini Naidu','Annie Besant'],'Rani Lakshmibai'],\n['https://commons.wikimedia.org/wiki/Special:Redirect/file/Sardar_Patel.jpg','Who is called the Iron Man of India?',['Sardar Vallabhbhai Patel','Bhagat Singh','Rajendra Prasad'],'Sardar Vallabhbhai Patel']\n];"""
          s=re.sub(r"const freedomFighters=.*?;\nconst indiaMap", freedom+"\nconst indiaMap", s, flags=re.S)

          # Ordering UI: no drag/drop; explicit empty placeholder boxes with tap-to-place.
          order_component = r'''function OrderActivity({questions,answers,setAnswers,module}){const [selected,setSelected]=useState({});const place=(qid,n,slot)=>{const current=Array.isArray(answers[qid])?[...answers[qid]]:[null,null,null,null];const old=current.indexOf(n);if(old>=0)current[old]=null;current[slot]=n;setAnswers({...answers,[qid]:current});setSelected({...selected,[qid]:null});};return <div className="orderGrid">{questions.map((q,i)=>{const placed=Array.isArray(answers[q.id])?answers[q.id]:[null,null,null,null];const available=q.nums.filter(n=>!placed.includes(n));return <div className="orderCard" key={q.id}><b>{i+1}. {module==='Ascending Order'?'Small → Big':'Big → Small'}</b><div className="numberChips">{available.map(n=><button type="button" key={n} onClick={()=>setSelected({...selected,[q.id]:n})} className={selected[q.id]===n?'chipActive':''}>{n}</button>)}</div><div className="dropSlots">{placed.map((n,slot)=><button type="button" className={n==null?'dropSlot empty':'dropSlot filled'} key={slot} onClick={()=>{if(selected[q.id]!=null)place(q.id,selected[q.id],slot);else if(n!=null){const next=[...placed];next[slot]=null;setAnswers({...answers,[q.id]:next});}}}>{n??'Tap to place'}</button>)}</div><small className="orderHint">Tap a number, then tap an empty box.</small><button type="button" className="clearOrder" onClick={()=>{setAnswers({...answers,[q.id]:[null,null,null,null]});setSelected({...selected,[q.id]:null})}}>Clear</button></div>})}</div>}'''
          s=re.sub(r'function OrderActivity.*?(?=function ShapeActivity)',order_component+'\n',s,flags=re.S)

          # Computer startup: same simple tap-to-place interaction, no drag/drop.
          computer_start = r'''function ComputerStartActivity({data,answers,setAnswers}){const current=answers.computerStart?answers.computerStart.split('|'):[null,null,null];const [selected,setSelected]=useState(null);const place=(slot,item)=>{const next=[...current];const old=next.indexOf(item);if(old>=0)next[old]=null;next[slot]=item;setAnswers({...answers,computerStart:next.join('|')});setSelected(null)};const available=data.items.filter(x=>!current.includes(x));return <div className="orderCard computerOrder"><div className="visualHero"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Basic%20desktop%20computer%20system.svg" alt="Computer with monitor, keyboard and mouse"/><span>🖥️ Let's start the computer!</span></div><h3>Tap a step, then tap its numbered box</h3><div className="numberChips">{available.map(item=><button type="button" key={item} onClick={()=>setSelected(item)} className={selected===item?'chipActive':''}>{item}</button>)}</div><div className="dropSlots">{Array.from({length:3},(_,i)=><button type="button" className={current[i]?'dropSlot filled':'dropSlot empty'} key={i} onClick={()=>{if(selected)place(i,selected);else if(current[i]){const next=[...current];next[i]=null;setAnswers({...answers,computerStart:next.join('|')});}}}>{current[i]||'Step '+(i+1)}</button>)}</div><p className="orderHint">No dragging needed — just tap and place.</p></div>}'''
          s=re.sub(r'function ComputerStartActivity.*?(?=function IndiaMapActivity)',computer_start+'\n',s,flags=re.S)

          # Visual GK/Computer activities and stable option order.
          state_component = r'''function StateCapitalActivity({data,answers,setAnswers}){return <div className="visualActivity"><div className="visualHero"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/India-map-en.svg" alt="Map of India with states and union territories"/><span>🗺️ Explore India's states</span></div><div className="wordGrid">{data.map(q=><div className="wordCard" key={q.id}><div className="visualBadge">🇮🇳</div><h3>{q.state}</h3><div className="wordPrompt">Which city is its capital?</div><div className="wordOptions">{q.options.map(o=><button key={o} className={answers[q.id]===o?'selected':''} onClick={()=>setAnswers({...answers,[q.id]:o})}>{o}</button>)}</div></div>)}</div></div>}'''
          s=re.sub(r'function StateCapitalActivity.*?(?=function MCQActivity)',state_component+'\n',s,flags=re.S)

          mcq_component = r'''function MCQActivity({module,data,answers,setAnswers}){const visual=module==='Indian Flag'?'https://upload.wikimedia.org/wikipedia/en/4/41/Flag_of_India.svg':module==='Computer Parts'?'https://commons.wikimedia.org/wiki/Special:Redirect/file/Basic%20desktop%20computer%20system.svg':module==='Who Invented It'?'https://commons.wikimedia.org/wiki/Special:Redirect/file/CharlesBabbage.jpg':null;return <div className="visualActivity">{visual&&<div className="visualHero"><img src={visual} alt={module}/><span>{module==='Indian Flag'?'🇮🇳 Our Indian Flag':module==='Computer Parts'?'🖥️ Meet the computer parts':'👨‍💻 Meet the inventor'}</span></div>}<div className="wordGrid">{data.map(([pic,q,opts,answer])=><div className="wordCard" key={q}>{module==='Freedom Fighters'?<img className="personPhoto" src={pic} alt="Freedom fighter"/>:<div className="picture">{pic}</div>}<h3>{q}</h3><div className="wordOptions">{stableShuffle(opts,q).map(o=><button key={o} className={answers[q]===o?'selected':''} onClick={()=>setAnswers({...answers,[q]:o})}>{o}</button>)}</div></div>)}</div></div>}'''
          s=re.sub(r'function MCQActivity\(.*?(?=function ComputerStartActivity)',mcq_component+'\n',s,flags=re.S)

          uses_component = r'''function ComputerUsesActivity({data,answers,setAnswers}){return <div className="visualActivity"><div className="visualHero"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Basic%20desktop%20computer%20system.svg" alt="Desktop computer parts"/><span>💻 Learn what each part does</span></div><div className="wordGrid">{data.map(([part,use])=>{const icon=part==='Keyboard'?'⌨️':part==='Mouse'?'🖱️':part==='Monitor'?'🖥️':part==='Printer'?'🖨️':part==='Speakers'?'🔊':'🎙️';const choices=stableShuffle([use,...data.filter(x=>x[0]!==part).slice(0,2).map(x=>x[1])],part);return <div className="wordCard" key={part}><div className="picture">{icon}</div><h3>{part}</h3><div className="wordPrompt">What is it used for?</div><div className="wordOptions">{choices.map(o=><button key={o} className={answers[part]===o?'selected':''} onClick={()=>setAnswers({...answers,[part]:o})}>{o}</button>)}</div></div>})}</div></div>}'''
          s=re.sub(r'function ComputerUsesActivity\(.*?(?=function makeHindiSequence)',uses_component+'\n',s,flags=re.S)

          page.write_text(s,encoding='utf-8')

          # Richer mobile visuals for the new activities.
          css_add = r'''
/* BrightSteps visual GK + Computer activities */
.visualActivity{display:grid;gap:16px}.visualHero{background:linear-gradient(135deg,#fff8df,#eef4ff);border:2px solid #fff;border-radius:24px;padding:18px;display:flex;align-items:center;justify-content:center;gap:16px;box-shadow:0 10px 24px #24304a12}.visualHero img{width:min(100%,420px);height:170px;object-fit:contain;border-radius:16px;background:#fff}.visualHero span{font-weight:900;font-size:18px}.personPhoto{width:100%;height:190px;object-fit:cover;border-radius:16px;background:#f3f1ea}.visualBadge{font-size:48px;background:#fff5df;border-radius:16px;padding:12px}.dropSlots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.dropSlot{min-height:58px;border:2px dashed #aaa6f2;background:#f7f5ff;border-radius:14px;font-weight:900;font-size:15px;color:#5d54bd}.dropSlot.filled{border-style:solid;background:#eeeaff;color:#4e45b5}.dropSlot.empty{color:#8b88a6}.numberChips button.chipActive{background:#7467f2;color:#fff;border-color:#7467f2;transform:translateY(-2px)}.orderHint{display:block;color:#777f91;margin:8px 0;font-weight:800}.clearOrder{border:0;background:#f3f3f0;border-radius:10px;padding:8px 12px;font-weight:900}.computerOrder{max-width:900px;margin:auto}.computerOrder .visualHero img{height:150px}.personPhoto{border:3px solid #fff;box-shadow:0 8px 18px #24304a18}.visualActivity .wordCard{background:linear-gradient(180deg,#fff,#fbfaff)}
@media(max-width:760px){.visualHero{flex-direction:column;text-align:center;padding:14px}.visualHero img{height:145px}.visualHero span{font-size:16px}.personPhoto{height:175px}.dropSlots{grid-template-columns:repeat(2,1fr)}.orderCard .numberChips button{min-height:46px;min-width:54px}.visualActivity .wordGrid{grid-template-columns:1fr 1fr}}
'''
          css.write_text(css.read_text(encoding='utf-8')+css_add,encoding='utf-8')

          # Remove this one-shot workflow after successful patch so it doesn't remain in the project.
          Path('.github/workflows/brightsteps-ux-patch.yml').unlink()

      - name: Commit and push
        run: |
          git config user.name "BrightSteps Bot"
          git config user.email "brightsteps-bot@users.noreply.github.com"
          git add app/page.js app/globals.css .github/workflows/brightsteps-ux-patch.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: improve kids ordering and visual GK/computer activities"
          git push origin HEAD:main
